<!-- Two-line integration: the widget lives in your DOM and inherits your design. -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>openfair widget example</title>
  <style>
    body { font-family: system-ui; max-width: 680px; margin: 40px auto; }
    openfair-create {
      --of-accent: #12a150;      /* your brand color */
      --of-radius: 14px;
    }
  </style>
</head>
<body>
  <h1>Launch a token</h1>
  <!-- Pinned build + SRI (every version's hash: https://sdk.openfair.app/sri.json).
       https://sdk.openfair.app/openfair.js tracks the latest release without a hash. -->
  <script src="https://sdk.openfair.app/v1.3.1/openfair.js"
          integrity="sha384-9osMQyD17R1C7btT3WlqdJ/3SU2+cy8pM7ifHf+h9n/7P1LQaLiBwkVbPDZQGQZR" crossorigin="anonymous"></script>
  <!-- Attributes: ref (your referral wallet), lang, mode="fair|instant" (locks the mode),
       pair="0x…" (fixes the quote asset; omit it to let the user pick one where pairs exist). -->
  <openfair-create ref="0xYourReferralWallet" lang="en"></openfair-create>
  <script>
    const el = document.querySelector('openfair-create');
    el.addEventListener('of-pair-change', (e) => console.log('pair:', e.detail)); // { quote, symbol }
    el.addEventListener('of-created', (e) => console.log('token created:', e.detail)); // { address, txHash, mode }
    // Headless API from the same bundle: window.Openfair, Openfair.version, Openfair.chains (manifests)
  </script>
</body>
</html>
